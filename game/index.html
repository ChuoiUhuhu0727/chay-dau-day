<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parking Jam</title>
<style>
  :root { --cell: min(13vw, 64px); --bg: #F6F1E7; --lot: #3B3A47; --line: #55536A; --ink: #1D1B26; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
         font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
         display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 24px 12px; }
  h1 { margin: 0; font-size: 26px; }
  #hud { display: flex; gap: 16px; align-items: center; font-weight: 600; min-height: 40px; }
  #lot { position: relative; width: calc(var(--cell) * 6 + 16px); height: calc(var(--cell) * 6 + 16px);
         background: var(--lot); border-radius: 16px; padding: 8px;
         background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
         background-size: var(--cell) var(--cell); background-position: 8px 8px; }
  .car { position: absolute; border: 0; border-radius: 10px; cursor: pointer; color: #fff; font-size: 22px; font-weight: 800;
         display: flex; align-items: center; justify-content: center; box-shadow: inset 0 -4px 0 rgba(0,0,0,.25);
         transition: transform .35s ease-in, opacity .35s ease-in; }
  .car.blocked { animation: shake .3s; }
  @keyframes shake { 25% { translate: -4px 0 } 75% { translate: 4px 0 } }
  #complete { position: fixed; inset: 0; background: rgba(29,27,38,.6); display: flex; align-items: center; justify-content: center; }
  #complete[hidden] { display: none; }
  #complete .box { background: #fff; border-radius: 20px; padding: 28px 36px; text-align: center; display: flex; flex-direction: column; gap: 12px; }
  #complete h2 { margin: 0; font-size: 30px; }
  button.btn { font: inherit; font-weight: 700; border: 0; border-radius: 12px; padding: 10px 18px; background: #4E3DC2; color: #fff; cursor: pointer; }
</style>
</head>
<body>
  <h1>Parking Jam</h1>
  <div id="hud"><span id="level-name"></span><span id="moves" aria-live="polite"></span></div>
  <div id="lot" aria-label="Bãi đỗ xe"></div>
  <div id="complete" hidden><div class="box"><h2>Hoàn thành!</h2></div></div>
  <script type="module" src="./ui.js"></script>
</body>
</html>
